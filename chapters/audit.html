            "10.1186/s12906-016-1131-8",

            "10.1111/j.1365-2184.2004.00307.x",
            "10.1023/A:1010963507086",

            "10.1016/j.ijfoodmicro.2004.03.022",

            "10.1207/s15327914nc5401_4",

            "10.1016/S0031-9422(00)97430-2",
            "10.1016/j.hermed.2021.100530"
        ];
        
        async function checkDois() {
            for (let doi of dois) {
                try {
                    let res = await fetch('https://doi.org/api/handles/' + encodeURIComponent(doi));
                    let data = await res.json();
                    if (data.responseCode !== 1) {
                        console.error('BROKEN:', doi, 'code:', data.responseCode);
                        document.getElementById('results').innerHTML += `<li>BROKEN: ${doi}</li>`;
                    }
                } catch (e) {
                    console.error('ERROR:', doi, e.message);
                    document.getElementById('results').innerHTML += `<li>ERROR: ${doi}</li>`;
                }
            }
            document.getElementById('status').innerText = 'Done';
            console.log('ALL_DONE');
        }
        checkDois();
    </script>
</body>
</html>
